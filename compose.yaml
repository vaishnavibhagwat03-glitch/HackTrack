# HackTrack: the whole system on one machine.
#
#   browser ──► proxy (Caddy, ports 80/443)
#                 ├─ /api/*  ──► client (C++ bridge :8080) ──► server (Node :4000) ──► SQLite volume
#                 └─ else    ──► web (Next.js :3000)
#
# Only the proxy is reachable from outside. Start everything with:
#   docker compose up -d --build
# Settings come from the .env file next to this one (copy .env.example).

services:
  server:
    build: ./server
    environment:
      # Used only when the database is created (first start or a re-seed).
      HACKTRACK_ADMIN_PASSWORD: ${HACKTRACK_ADMIN_PASSWORD:?Set HACKTRACK_ADMIN_PASSWORD in .env}
    volumes:
      - hacktrack-data:/data
    restart: unless-stopped

  client:
    build: ./hacktrack-client
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_HACKTRACK_API: /api
        NEXT_PUBLIC_HIDE_ADMIN_DEMO: "1"
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # ":80" = plain HTTP on any address. A domain name = automatic HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      client:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hacktrack-data:   # the SQLite database
  caddy-data:       # HTTPS certificates
  caddy-config:
